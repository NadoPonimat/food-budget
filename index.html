<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бюджет на еду</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:0 auto;padding:12px;background:#f4f4f4;color:#222}
label{display:block;margin:8px 0;font-size:14px}
input,select{width:100%;box-sizing:border-box;padding:10px;font-size:16px;margin-top:3px}
button{width:100%;padding:12px;font-size:17px;background:#2e7d32;color:#fff;border:0;border-radius:8px;margin:8px 0}
button.g{background:#777;font-size:15px;padding:8px}
button.sm{width:auto;padding:4px 14px;font-size:16px;margin:0 2px;background:#555}
button.add{width:auto;padding:6px 14px;font-size:14px;margin:6px 0 0}
.c{background:#fff;border-radius:8px;padding:10px;margin:8px 0}
.t{font-weight:bold;margin-bottom:4px}
.s{color:#666;font-size:13px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.w{color:#b71c1c}
a{color:#1565c0}
summary{font-weight:bold;font-size:16px;padding:6px 0}
</style></head><body>
<div id="err" style="color:#b71c1c;font-size:14px;font-weight:bold"></div>
<script>
window.onerror=function(m,s,l){document.getElementById('err').textContent='Ошибка: '+m+' (строка '+l+')';};
</script>
<h2>Бюджет на еду <span class="s">v44</span></h2>
<details class="c"><summary>🔍 Поиск по товарам</summary>
<input id="q" type="search" placeholder="Например: гречка, молоко 1 л" oninput="srch()">
<div id="sr"></div></details>
<details class="c"><summary id="cs">🛒 Корзины</summary>
<div id="cart"></div></details>
<details class="c"><summary>📍 Магазины Magnum (Алматы)</summary>
<input id="st" type="search" placeholder="Улица, например: Абая" oninput="drawSt()">
<div class="s" id="stn"></div>
<div id="stl"></div></details>
<label>Бюджет на месяц, ₸<input id="b" type="number" value="50000"></label>
<label>Месяц<input id="m" type="month"></label>
<div class="t">Семья</div>
<div id="fam"></div>
<button class="g" onclick="addP()">+ Добавить человека</button>
<label><input id="nc" type="checkbox" style="width:auto;margin-right:8px">Не могу готовить</label>
<label>Пачек сигарет в день<input id="pk" type="number" step="0.1" value="0"></label>
<label>Цена пачки, ₸<input id="pp" type="number" value="0"></label>
<button onclick="go()">Составить рацион</button>
<div id="out"></div>
<script>
const COOK={"Мясо":[.15,200,200],"Птица":[.15,200,170],"Рыба":[.05,100,150],"Яйца":[.08,110,150],"Крупы":[.12,150,350],"Макароны":[.08,100,350],"Овощи":[.10,500,35],"Фрукты":[.04,200,50],"Молочка":[.08,400,60],"Хлеб":[.06,250,250],"Масло растительное":[.03,30,900],"Сахар":[.02,40,400],"Консервы":[.02,100,120],"Сыр":[.02,40,350]};
const NOC={"Хлеб":[.16,250,250],"Колбасы":[.10,100,300],"Сыр":[.10,60,350],"Молочка":[.12,500,60],"Консервы":[.10,150,120],"Завтраки":[.08,100,370],"Готовая еда":[.18,400,200],"Фрукты":[.06,250,50],"Орехи":[.04,50,600],"Овощи":[.06,300,35]};
const BAD=/тофу|корм|детск|набор|подароч|питомц|шоколад|конфет|киндер|перепел|бургер|наггет|панир|икр|сурими|палочк/i;
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let F=[{s:'м',a:30,w:75,h:175}],D=null,M=null,LR=[],CART=[];
$('m').value=new Date().toISOString().slice(0,7);
try{const S=JSON.parse(localStorage.getItem('fb')||'null');if(S){if(S.F&&S.F.length)F=S.F;$('b').value=S.b||50000;$('pk').value=S.pk||0;$('pp').value=S.pp||0;$('nc').checked=!!S.nc}}catch(e){}
try{CART=JSON.parse(localStorage.getItem('fbc')||'[]')||[]}catch(e){CART=[]}
function drawFam(){
$('fam').innerHTML=F.map((p,i)=>'<div class="c"><div class="t">Человек '+(i+1)+(F.length>1?' · <a href="#" onclick="rm('+i+');return false">удалить</a>':'')+'</div><div class="r">'
+'<label>Пол<select onchange="F['+i+'].s=this.value"><option value="м"'+(p.s=='м'?' selected':'')+'>муж</option><option value="ж"'+(p.s=='ж'?' selected':'')+'>жен</option></select></label>'
+'<label>Возраст<input type="number" value="'+p.a+'" onchange="F['+i+'].a=+this.value"></label>'
+'<label>Вес, кг<input type="number" value="'+p.w+'" onchange="F['+i+'].w=+this.value"></label>'
+'<label>Рост, см<input type="number" value="'+p.h+'" onchange="F['+i+'].h=+this.value"></label></div></div>').join('');
}
function addP(){F.push({s:'м',a:30,w:75,h:175});drawFam()}
function rm(i){F.splice(i,1);drawFam()}
drawFam();
fetch('prices.json').then(r=>r.json()).then(j=>D=j).catch(e=>{$('err').textContent='Не загрузились цены: '+e.message});
fetch('magnum.json').then(r=>r.json()).then(j=>{M=j;drawCart()}).catch(e=>{});
function need1(p){return(10*p.w+6.25*p.h-5*p.a+(p.s=='м'?5:-161))*1.4}
function gr(n){
if(/яйц/i.test(n)){const e=n.match(/(\d+)\s*шт/i);return e?e[1]*55:0}
const a=[...n.matchAll(/(\d+(?:[.,]\d+)?)\s*(кг|г|мл|л)(?![а-яa-z])/gi)];
if(!a.length)return /(^|\s)кг\.?$/i.test(n.trim())?1000:0;
const m=a[a.length-1];const v=parseFloat(m[1].replace(',','.'));const u=m[2].toLowerCase();return(u=='кг'||u=='л')?v*1000:v}
function items(c){
if(c=='Яйца')return D.items.filter(x=>x.cat=='Яйца и масло'&&/яйц/i.test(x.name));
if(c=='Сахар')return D.items.filter(x=>x.cat=='Сахар и соль'&&/сахар/i.test(x.name)&&!/соль/i.test(x.name));
return D.items.filter(x=>x.cat==c);
}
function cap(s){s=s.toLowerCase().trim();return s.charAt(0).toUpperCase()+s.slice(1)}
function allItems(){
const B=(M?M.items:[]).map(x=>({name:cap(x.name),price:x.price,old:x.old,until:x.until,store:'Magnum',cat:'Акция Magnum',url:'',shops:x.shops||[]}));
return D.items.concat(B);
}
function saveC(){try{localStorage.setItem('fbc',JSON.stringify(CART))}catch(e){}}
function addC(i,btn){
const x=LR[i];if(!x)return;
const nm=x.name.replace(/^Дисконт:\s*/,'');
const st=x.store||'Arbuz';
const f=CART.find(c=>c.store==st&&c.name==nm);
if(f){f.q++;if(x.shops&&!f.shops)f.shops=x.shops}else CART.push({name:nm,price:x.price,store:st,url:x.url||'',q:1,shops:x.shops||null});
saveC();drawCart();
if(btn)btn.textContent='✓ добавлено ('+(f?f.q:1)+')';
}
function chg(i,d){CART[i].q+=d;if(CART[i].q<=0)CART.splice(i,1);saveC();drawCart()}
function clr(){if(confirm('Очистить все корзины?')){CART=[];saveC();drawCart()}}
function drawCart(){
const n=CART.reduce((a,c)=>a+c.q,0);
$('cs').textContent='🛒 Корзины'+(n?' ('+n+' шт)':'');
const o=$('cart');
if(!CART.length){o.innerHTML='<div class="s">Пусто. Найди товар в поиске и нажми «+ в корзину».</div>'}
else{
const st=[...new Set(CART.map(c=>c.store))];
let all=0,h='';
st.forEach(s=>{
let sum=0;
h+='<div class="c" style="background:#f9f9f9"><div class="t">🛒 '+esc(s)+'</div>';
CART.forEach((c,i)=>{
if(c.store!=s)return;
sum+=c.price*c.q;
h+='<div style="margin:6px 0">'+esc(c.name)+'<div class="s">'+c.price+' ₸ × '+c.q+' = <b>'+(c.price*c.q)+' ₸</b> <button class="sm" onclick="chg('+i+',-1)">−</button><button class="sm" onclick="chg('+i+',1)">+</button>'+(c.url?' · <a href="'+esc(c.url)+'" target="_blank">открыть</a>':'')+'</div></div><hr>';
});
h+='<div class="t">Итого '+esc(s)+': '+sum+' ₸</div></div>';
all+=sum;
});
h+='<div class="c"><div class="t">Всего по всем корзинам: '+all+' ₸</div><button class="g" onclick="clr()">Очистить корзины</button></div>';
o.innerHTML=h;
}
drawSt();
}
function shopList(){
if(!M||!M.shops)return {L:[],note:'Магазины ещё грузятся'};
const mi=CART.filter(c=>c.store=='Magnum'&&c.shops&&c.shops.length);
if(!mi.length)return {L:M.shops,note:'Все магазины Magnum в Алматы: '+M.shops.length};
let ids=mi[0].shops.slice();
mi.forEach(c=>{ids=ids.filter(id=>c.shops.includes(id))});
const L=M.shops.filter(s=>ids.includes(s.id));
return {L:L,note:L.length?'Магазины, где есть всё из корзины Magnum: '+L.length:'Нет магазина, где есть все товары корзины Magnum. Попробуй убрать часть товаров.'};
}
function drawSt(){
const r=shopList();
const q=$('st').value.trim().toLowerCase();
const R=r.L.filter(s=>!q||(s.address+' '+s.name).toLowerCase().includes(q));
$('stn').textContent=r.note+(q?' · по запросу: '+R.length:'');
let h='';
R.slice(0,50).forEach(s=>{
const g=s.geo;
h+='<div style="margin:6px 0">'+esc(s.name)+'<div class="s">'+esc((s.address||'').trim())+(g&&g.latitude?' · <a target="_blank" href="https://www.google.com/maps/search/?api=1&query='+g.latitude+','+g.longitude+'">на карте</a>':'')+'</div></div><hr>';
});
if(R.length>50)h+='<div class="s">Показаны первые 50, уточни улицу</div>';
$('stl').innerHTML=h;
}
drawCart();
function srch(){
const q=$('q').value.trim().toLowerCase();
const o=$('sr');
if(q.length<2){o.innerHTML='';return}
if(!D){o.textContent='Цены ещё грузятся';return}
const ws=q.split(/\s+/);
const L=allItems().filter(x=>{const n=x.name.toLowerCase();return ws.every(w=>n.includes(w))}).map(x=>{const g=gr(x.name);const ok=g>=50&&g<=10000&&!/\d\/\d/.test(x.name);return{...x,pk:ok?x.price/g*1000:0}});
if(!L.length){o.textContent='Ничего не найдено';LR=[];return}
L.sort((a,b)=>(a.pk||1e9)-(b.pk||1e9)||a.price-b.price);
LR=L.slice(0,30);
const na=L.filter(x=>x.store=='Magnum').length;
let h='<div class="s">Найдено: '+L.length+' (Arbuz '+(L.length-na)+', Magnum '+na+')'+(L.length>30?', показаны 30 самых дешёвых':'')+'</div>';
LR.forEach((x,i)=>{
const top=(i==0&&x.pk);
h+='<div class="c"'+(top?' style="border:2px solid #2e7d32"':'')+'><div>'+esc(x.name.replace(/^Дисконт:\s*/,''))+'</div><div class="s">'
+(top?'<b style="color:#2e7d32">самый дешёвый</b> · ':'')
+'<b>'+x.price+' ₸</b>'+(x.old?' <s>'+x.old+'</s>':'')+(x.pk?' ('+Math.round(x.pk)+' ₸/кг)':'')
+' · <b>'+esc(x.store||'Arbuz')+'</b>'+(x.until?' · акция до '+esc(x.until):' · '+esc(x.cat))
+(x.url?' · <a href="'+esc(x.url)+'" target="_blank">открыть</a>':'')+'</div>'
+'<button class="add" onclick="addC('+i+',this)">+ в корзину</button></div>';
});
o.innerHTML=h;
}
function go(){try{go2()}catch(e){$('out').textContent='Ошибка: '+e.message}}
function go2(){
if(!D){$('out').textContent='Цены ещё грузятся, нажми ещё раз';return}
localStorage.setItem('fb',JSON.stringify({F:F,b:$('b').value,pk:$('pk').value,pp:$('pp').value,nc:$('nc').checked}));
const [y,mo]=$('m').value.split('-').map(Number);
const days=new Date(y,mo,0).getDate();
const mn=new Date(y,mo-1,1).toLocaleString('ru',{month:'long'});
const smoke=Math.round(+$('pk').value*+$('pp').value*days);
const food=+$('b').value-smoke;
if(food<=0){$('out').textContent='Сигареты съедают весь бюджет';return}
const daily=food/days;
const need=F.reduce((a,p)=>a+need1(p),0);
const sc=need/2000;
const C=$('nc').checked?NOC:COOK;
const P=[];
for(const c in C){
const sh=C[c][0],mx=C[c][1]*sc,kk=C[c][2];
const lim=food*sh;
const K=(c=='Овощи')?3:2;
const seen=new Set();
const L=items(c).filter(x=>!BAD.test(x.name)&&!/\d\/\d/.test(x.name)).map(x=>({...x,nm:x.name.replace(/^Дисконт:\s*/,''),g:gr(x.name)})).filter(x=>x.g>=100&&x.g<=10000&&x.price<=lim*0.6&&!seen.has(x.nm)&&seen.add(x.nm)).map(x=>({...x,pk:x.price/x.g*1000})).sort((a,b)=>a.pk-b.pk).slice(0,K);
if(!L.length)continue;
const half=lim/L.length;
const dg=L.map(x=>half/x.pk*1000/days);
const tot=dg.reduce((a,b)=>a+b,0);
const f=tot>mx?mx/tot:1;
L.forEach((x,i)=>{P.push({c:c,x:x,n:Math.max(1,Math.round(dg[i]*f*days/x.g)),kk:kk})});
}
let spent=P.reduce((a,p)=>a+p.n*p.x.price,0);
while(spent>food&&P.length){
let best=null;
P.forEach(p=>{if(p.n>1&&(!best||p.n*p.x.price>best.n*best.x.price))best=p});
if(best){best.n--;spent-=best.x.price;continue}
let mi=0;P.forEach((p,i)=>{if(p.x.price>P[mi].x.price)mi=i});
spent-=P[mi].n*P[mi].x.price;P.splice(mi,1);
}
let h='<div class="c"><div class="t">'+mn+': '+days+' дн.</div>Сигареты: '+smoke+' ₸<br>На еду: '+Math.round(food)+' ₸<br><b>В день: '+Math.round(daily)+' ₸</b> на '+F.length+' чел.<br>Нужно примерно '+Math.round(need)+' ккал в день</div>';
let kcal=0,cur='';
P.forEach(p=>{
if(p.c!=cur){if(cur)h+='</div>';h+='<div class="c"><div class="t">'+p.c+'</div>';cur=p.c}
const d=p.n*p.x.g/days,cost=p.n*p.x.price;
kcal+=d/100*p.kk;
h+='<div>'+esc(p.x.nm)+'<div class="s">'+p.x.price+' ₸ ('+Math.round(p.x.pk)+' ₸/кг) · Arbuz · в день '+Math.round(d)+' г · в месяц '+p.n+' шт = '+cost+' ₸ · <a href="'+esc(p.x.url)+'" target="_blank">открыть</a></div></div><hr>';
});
if(cur)h+='</div>';
const pc=Math.round(kcal/need*100);
h+='<div class="c"><div class="t">Итого</div>Продукты: '+Math.round(spent)+' ₸<br>Рацион даёт около '+Math.round(kcal)+' ккал в день, это '+pc+'% от нужного (грубая оценка)<br>'+(pc<85?'<span class="w">Бюджета не хватает на полноценное питание.</span><br>':'')+'Осталось: '+Math.round(food-spent)+' ₸ (соль, специи, чай и т.п.)</div>';
h+='<div class="s">Цены обновлены: '+D.updated+'</div>';
$('out').innerHTML=h;
}
</script></body></html>
