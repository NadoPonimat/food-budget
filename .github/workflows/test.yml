name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" -L --max-time 30 "https://arbuz.kz/ru/almaty/collections/252385-vygodnaya_polka" -o p.html
          echo "api paths:"
          grep -o '/api/[A-Za-z0-9_/.-]*' p.html | sort -u | head -15
          echo "price samples:"
          grep -o -i '.\{80\}price.\{80\}' p.html | head -3
