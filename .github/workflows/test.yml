name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def g(p):
              r = urllib.request.Request("https://magnum.kz:1337" + p, headers={"User-Agent": "Mozilla/5.0"})
              return json.loads(urllib.request.urlopen(r, timeout=30).read().decode())
          for c in g("/api/cities")["data"]:
              print(c["id"], c["attributes"]["name"], c["attributes"]["slug"])
          try:
              d = g("/api/products?populate=*&pagination[pageSize]=2")
              print(json.dumps(d["data"][0], ensure_ascii=False)[:1800])
          except Exception as e:
              print("populate ERR", e)
          names = set()
          for pg in range(1, 15):
              r = g("/api/products?pagination[pageSize]=100&pagination[page]=" + str(pg))
              for i in r["data"]:
                  names.add(i["attributes"]["name"])
          print("unique names:", len(names))
          PY
