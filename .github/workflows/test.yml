name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://arbuz.kz https://magnum.kz https://small.kz; do
            echo "$u"
            curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0" -L --max-time 20 "$u"
          done
