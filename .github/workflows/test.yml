name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" -L --max-time 30 "https://magnum.kz" | sed 's#\\u002F#/#g; s#\\/#/#g' > m.html
          echo "size: $(wc -c < m.html)"
          echo "--- paths with catalog/categor:"
          grep -o '"[^" ]*\(catalog\|categor\)[^" ]*"' m.html | sort -u | head -25
          echo "--- NUXT start:"
          grep -o 'window.__NUXT__=.\{300\}' m.html | head -1
