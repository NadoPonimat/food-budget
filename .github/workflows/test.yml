name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://arbuz.kz https://arbuz.kz/ru/almaty/collections/252385-vygodnaya_polka; do
            curl -s -A "Mozilla/5.0" -L --max-time 30 "$u" | sed 's#\\/#/#g' > p.html
            echo "== $u"
            grep -o '/ru/almaty/catalog/[^"?& ]*' p.html | grep -v '/item/' | sort -u | head -40
          done
