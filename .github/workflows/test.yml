name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://arbuz.kz https://magnum.kz; do
            curl -s -A "Mozilla/5.0" -L --max-time 20 "$u" -o page.html
            echo "== $u"
            echo "size: $(wc -c < page.html)"
            echo "tenge: $(grep -o '₸' page.html | wc -l)"
            echo "next_data: $(grep -c '__NEXT_DATA__' page.html)"
          done
