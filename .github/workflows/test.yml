name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" -L --max-time 30 "https://arbuz.kz" | sed 's#\\/#/#g' > p.html
          grep -o '/ru/almaty/catalog/cat/[^"?& ]*' p.html | sort -u | grep -i -E 'ovosh|frukt|yaic|yaits|ryb|ptic|kur|zelen|gotov|myas|morozh|orehi|maslo'
