name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, urllib.request
          def g(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(r, timeout=30).read().decode("utf-8", "ignore")
          t = g("https://magnum.kz")
          js = sorted(set(re.findall(r'/_nuxt/[A-Za-z0-9_./-]+\.js', t)))
          paths = set()
          for j in js:
              s = g("https://magnum.kz" + j)
              for m in re.findall(r'\.(?:get|post)\(\s*[`"\']([^`"\']{3,80})[`"\']', s):
                  paths.add(m)
          print("paths in js:")
          for p in sorted(paths)[:50]:
              print(" ", p)
          print("direct tests:")
          for p in ("/products", "/categories", "/api/products", "/catalog", "/catalogs", "/items"):
              try:
                  body = g("https://magnum.kz:1337" + p)
                  print(p, "OK", len(body), body[:200].replace("\n", " "))
              except Exception as e:
                  print(p, "ERR", e)
          PY
