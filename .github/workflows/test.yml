name: Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" -L --max-time 30 "https://arbuz.kz/ru/almaty/collections/252385-vygodnaya_polka" -o p.html
          sed -i 's/&quot;/"/g' p.html
          echo "products: $(grep -o '"priceActual":' p.html | wc -l)"
          grep -o '.\{450\}"priceActual":[0-9]*.\{100\}' p.html | head -1 | tr ',' '\n'
