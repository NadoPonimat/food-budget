name: Scrape
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape.py
      - run: python3 scrape_magnum.py
        continue-on-error: true
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json magnum.json
          git commit -m "update prices" || echo "no changes"
          git push
